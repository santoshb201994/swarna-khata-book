services:
  - type: web
    name: swarna-khata-book
    runtime: python
    autoDeployTrigger: commit
    buildCommand: uv sync --frozen && uv cache prune --ci && uv run --directory backend python manage.py collectstatic --noinput
    startCommand: cd backend && uv run python manage.py migrate_schemas --noinput && exec uv run uvicorn config.asgi:application --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.16
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        sync: false
